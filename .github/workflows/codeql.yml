name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36" > /dev/null
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      # CodeQL must observe compilation, not reuse Gradle's cached task outputs.
      - run: ./gradlew :app:compileDebugKotlin --no-build-cache --rerun-tasks --stacktrace
      - uses: github/codeql-action/analyze@v3
