org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon, which otherwise takes Gradle's 2 GB; debug and release
# compile in parallel and the app has outgrown it (CI ran out of memory, 2026-11-09).
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Instrumented tests run on the owner's phone: never uninstall iCode afterwards because that deletes
# its runtime, settings, and credentials. See docs/build-and-release.md.
android.injected.androidTest.leaveApksInstalledAfterRun=true
